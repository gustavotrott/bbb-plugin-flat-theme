name: Build

# Pushes to main publish the plugin on GitHub Pages, so a meeting can load it
# straight from https://<owner>.github.io/<repo>/manifest.json.
# Tags (v*) attach a ready-to-install tarball to a GitHub release.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build-bundle
      # Until bigbluebutton/bigbluebutton#26415 ships, the stylesheet for 4.0.3
      # (which has its classes) lives on the bbb-classes-26415 branch
      - name: Stylesheet for BigBlueButton 4.0.3
        run: |
          if git fetch --depth=1 origin bbb-classes-26415; then
            git worktree add /tmp/bbb-4.0.3 FETCH_HEAD
            node scripts/css.js --root /tmp/bbb-4.0.3 --version 4.0.3
          fi
      - name: Package
        run: tar czf "${{ github.event.repository.name }}.tar.gz" --owner=0 --group=0 -C dist .
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "${{ github.event.repository.name }}.tar.gz" dist/theme.css --title "${{ github.ref_name }}" --generate-notes

  pages:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
